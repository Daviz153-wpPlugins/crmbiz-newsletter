name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from plugin file
        id: version
        run: |
          VERSION=$(grep -oP "define\('CRMBIZ_NL_VERSION',\s*'\K[^']+" crmbiz-newsletter.php)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if this version was already released
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "v${{ steps.version.outputs.version }} already released — skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build ZIP
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p build/crmbiz-newsletter
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='build/' \
            --exclude='docs/' \
            --exclude='archive/' \
            --exclude='tests/' \
            --exclude='vendor/' \
            --exclude='*.md' \
            --exclude='phpunit.xml' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='.gitignore' \
            . build/crmbiz-newsletter/
          cd build
          zip -r crmbiz-newsletter-${VERSION}.zip crmbiz-newsletter/

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: build/crmbiz-newsletter-${{ steps.version.outputs.version }}.zip
