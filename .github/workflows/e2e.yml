name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    name: E2E Tests (PHP 8.2)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, openssl, mbstring

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install WP-CLI
        run: |
          curl -sO https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp

      - name: Install & configure WordPress
        run: |
          mkdir -p /tmp/wordpress && cd /tmp/wordpress
          wp core download --quiet
          wp config create --dbname=wordpress --dbuser=root --dbpass=root \
            --dbhost=127.0.0.1 --quiet
          wp core install --url=http://localhost:8080 --title="CI Test" \
            --admin_user=admin --admin_password=password \
            --admin_email=test@example.com --quiet
          # REST API(/wp-json/...)가 동작하려면 퍼머링크 활성화 필요
          wp rewrite structure '/%postname%/' --hard --path=/tmp/wordpress
          wp rewrite flush --hard --path=/tmp/wordpress

      - name: Install plugins
        run: |
          # FluentCRM 스텁 (플러그인 활성화에 필요)
          mkdir -p /tmp/wordpress/wp-content/plugins/fluent-crm
          cat > /tmp/wordpress/wp-content/plugins/fluent-crm/fluent-crm.php <<'PHP'
          <?php
          /**
           * Plugin Name: FluentCRM Stub
           */
          define('FLUENTCRM', true);
          function FluentCrmApi($module = null) { return null; }
          PHP

          # 이 플러그인 복사
          mkdir -p /tmp/wordpress/wp-content/plugins/crmbiz-newsletter
          cp -r $GITHUB_WORKSPACE/. /tmp/wordpress/wp-content/plugins/crmbiz-newsletter/

          wp plugin activate fluent-crm crmbiz-newsletter \
            --quiet --path=/tmp/wordpress

      - name: Seed test data
        run: |
          wp eval '
          global $wpdb;
          $tbl = $wpdb->prefix . "crmbiz_newsletters";

          // 액션 테스트가 각 상태별 항목을 찾을 수 있도록 다양한 상태로 시딩
          // sent×6 = campaign_total(6) > 5 → 대시보드 페이지네이션 표시 보장
          $seeds = [
            ["CI 발송완료 #1", "sent",      3, 0],
            ["CI 발송완료 #2", "sent",      5, 0],
            ["CI 발송완료 #3", "sent",      2, 1],
            ["CI 발송완료 #4", "sent",      4, 0],
            ["CI 발송완료 #5", "sent",      2, 0],
            ["CI 발송완료 #6", "sent",      1, 0],
            ["CI 초안",        "draft",     0, 0],
            ["CI 대기중",      "queued",    0, 0],
            ["CI 실패",        "failed",    0, 2],
            ["CI 취소됨",      "cancelled", 0, 0],
          ];

          foreach ($seeds as [$title, $status, $success, $fail]) {
            $post_id = wp_insert_post([
              "post_title"  => $title,
              "post_status" => "publish",
              "post_type"   => "post",
            ]);
            $wpdb->insert($tbl, [
              "post_id"         => $post_id,
              "status"          => $status,
              "send_mode"       => "immediate",
              "sent_at"         => in_array($status, ["sent","failed"]) ? current_time("mysql") : null,
              "success_count"   => $success,
              "fail_count"      => $fail,
              "recipient_count" => $success + $fail,
              "tag_ids"         => "[]",
              "list_ids"        => "[]",
              "created_at"      => current_time("mysql"),
              "updated_at"      => current_time("mysql"),
            ]);
          }

          $count = $wpdb->get_var("SELECT COUNT(*) FROM {$tbl}");
          echo "Seeded {$count} newsletter records\n";

          // 수신거부 샘플 (수신거부 관리 페이지 테스트용)
          $utbl = $wpdb->prefix . "crmbiz_nl_unsubscribers";
          $wpdb->insert($utbl, [
            "email"            => "unsub-ci@example.com",
            "unsubscribed_at"  => current_time("mysql"),
          ]);
          echo "Seeded unsubscriber record\n";
          ' --path=/tmp/wordpress

      - name: Create editor test user
        run: |
          wp user create editor_test editor@ci.test \
            --role=editor --user_pass=editorpass \
            --path=/tmp/wordpress --quiet || true

      - name: Start WordPress server
        run: |
          # wp server = PHP 내장 서버 + WordPress 라우팅
          wp server --host=localhost --port=8080 --path=/tmp/wordpress &
          # 서버 준비 대기
          timeout 15 bash -c 'until curl -sf http://localhost:8080/wp-login.php; do sleep 1; done'

      - name: Run E2E tests
        env:
          WP_BASE_URL: http://localhost:8080
          WP_ADMIN_USER: admin
          WP_ADMIN_PASS: password
          WP_EDITOR_USER: editor_test
          WP_EDITOR_PASS: editorpass
          WP_PATH: /tmp/wordpress
          ENABLE_MIGRATION_TEST: '1'
          ENABLE_CONFLICT_TEST: '1'
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
