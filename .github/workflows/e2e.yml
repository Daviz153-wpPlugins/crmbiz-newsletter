name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Setup WordPress
        run: |
          # WordPress CLI 설치
          curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp

          # WP 설치
          mkdir -p /tmp/wordpress && cd /tmp/wordpress
          wp core download --quiet
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --quiet
          wp core install --url=http://localhost:8080 --title=Test --admin_user=admin \
            --admin_password=password --admin_email=test@example.com --quiet

          # PHP 내장 서버 시작
          php -S localhost:8080 -t /tmp/wordpress &

          # 플러그인 복사 및 활성화
          mkdir -p /tmp/wordpress/wp-content/plugins/crmbiz-newsletter
          cp -r $GITHUB_WORKSPACE/. /tmp/wordpress/wp-content/plugins/crmbiz-newsletter/

          # FluentCRM 없이는 활성화 불가 → 스텁으로 대체
          mkdir -p /tmp/wordpress/wp-content/plugins/fluent-crm
          echo '<?php /* FluentCRM stub */ define("FLUENTCRM", true); function FluentCrmApi($a=null){return null;}' \
            > /tmp/wordpress/wp-content/plugins/fluent-crm/fluent-crm.php
          wp plugin activate fluent-crm crmbiz-newsletter --quiet --path=/tmp/wordpress

      - name: Run E2E tests
        env:
          WP_BASE_URL: http://localhost:8080
          WP_ADMIN_USER: admin
          WP_ADMIN_PASS: password
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
